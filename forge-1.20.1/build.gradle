plugins {
    id 'java-library'
    // ModDevGradle Legacy: Forge 1.20.1 on Gradle 9 (ForgeGradle 6 does not run on Gradle 9).
    id 'net.neoforged.moddev.legacyforge' version '2.0.146'
}

group = rootProject.group
version = rootProject.version
base { archivesName = "${mod_id}-forge-1.20.1" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)   // 1.20.1 = Java 17 (no switch patterns, no sequenced collections)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    runs {
        client { client() }
        server { server() }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

// TODO when mixins are ported: MDG Legacy mixin setup (annotation processor + refmap). Not the Sponge gradle plugin, it needs ForgeGradle.

repositories {
    mavenCentral()
    maven { name = 'ModMaven (AE2)'; url = 'https://modmaven.dev/'; content { includeGroup 'appeng' } }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    // TODO when mixins are ported: MixinExtras (compileOnly/annotationProcessor + jarJar).

    // Mods that are shipped in production (SRG) names go through modImplementation so they get remapped.
    modImplementation "appeng:appliedenergistics2-forge:${ae2_version}"
    // LDLib 1 official 1.20.1 build. Drop the jar in forge-1.20.1/libs/ (gitignored).
    modImplementation files("libs/ldlib-forge-1.20.1-${ldlib_version}.jar")
}

tasks.named('processResources') {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: project.version.toString(), mod_license: mod_license,
                 forge_version_range: forge_version_range, ae2_version_range: ae2_version_range,
                 ldlib_version_range: ldlib_version_range, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}
